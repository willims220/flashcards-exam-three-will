(function(){
'use strict';
const $=id=>document.getElementById(id);
const key='eye-deck-edits-v2';
let edits={};
try{edits=JSON.parse(window.localStorage.getItem(key)||'{}')||{}}catch(e){edits={}}
const cards=BASE.map((card,i)=>({...card,answer:edits[i]||card.answer}));
let order=cards.map((_,i)=>i), position=0, results={};
function normalize(value){return String(value).trim().toLocaleLowerCase().replace(/\s+/g,' ')}
function score(){
  $('score').textContent='Correct '+Object.values(results).filter(x=>x===true).length+' · Missed '+Object.values(results).filter(x=>x===false).length;
}
function display(){
 if(order.length===0){order=cards.map((_,i)=>i);position=0}
 const id=order[position], card=cards[id];
 $('photo').src=card.src;
 $('progress').textContent='Card '+(position+1)+' of '+order.length+' · PDF page '+card.page;
 $('typed').value='';$('typed').className='';$('msg').textContent='';$('msg').className='msg';score();
}
function checkAnswer(){
 const id=order[position], input=$('typed'), value=input.value;
 if(!normalize(value)){$('msg').textContent='Enter an answer first.';$('msg').className='msg bad';input.focus();return}
 const correct=normalize(value)===normalize(cards[id].answer);
 results[id]=correct;input.className=correct?'correct':'wrong';
 $('msg').className='msg '+(correct?'good':'bad');
 $('msg').textContent=correct?'Correct!':'Correct answer: '+cards[id].answer;score();
}
function move(delta){position=(position+delta+order.length)%order.length;display()}
$('checkBtn').addEventListener('click',checkAnswer);
$('form').addEventListener('submit',event=>{event.preventDefault();checkAnswer()});
$('prev').addEventListener('click',()=>move(-1));
$('next').addEventListener('click',()=>move(1));
$('shuffle').addEventListener('click',()=>{order=cards.map((_,i)=>i);for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}position=0;display()});
$('missed').addEventListener('click',()=>{const missed=Object.keys(results).filter(k=>results[k]===false).map(Number);if(missed.length===0){$('msg').textContent='No missed cards yet.';return}order=missed;position=0;display()});
$('all').addEventListener('click',()=>{order=cards.map((_,i)=>i);position=0;display()});
$('edit').addEventListener('click',()=>{const id=order[position],newAnswer=prompt('Edit correct answer:',cards[id].answer);if(newAnswer&&newAnswer.trim()){cards[id].answer=newAnswer.trim();edits[id]=cards[id].answer;try{window.localStorage.setItem(key,JSON.stringify(edits))}catch(e){}display()}});
$('reset').addEventListener('click',()=>{results={};order=cards.map((_,i)=>i);position=0;display()});
display();
})();
</script></body></html>
