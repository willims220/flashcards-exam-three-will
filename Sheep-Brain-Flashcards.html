function getAnswer(i){return overrides[i]||cards[i].answer}
function render(){let id=current();if(id===undefined){el('feedback').textContent='No missed cards yet.';return;}el('picture').src='data:image/jpeg;base64,'+cards[id].image;el('picture').alt='Original PDF picture for card '+(id+1);el('answer').value='';el('answer').style.borderColor='#d1d5db';el('feedback').textContent='';el('feedback').className='';el('editArea').style.display='none';el('progress').textContent=`Card ${position+1} of ${order.length} • Source page ${cards[id].page}`;let done=results.filter(x=>x!==null).length;let right=results.filter(x=>x===true).length;el('status').textContent=`Score: ${right} correct / ${done} answered • ${cards.length} total cards`}
function checkAnswer(){const id=current();let user=el('answer').value.trim();if(!user){el('feedback').textContent='Type your answer first.';return}const correct=getAnswer(id);const ok=normalize(user)===normalize(correct)|| (correct.toLowerCase().includes(' / ') && correct.toLowerCase().split(' / ').some(x=>normalize(x)===normalize(user)));results[id]=ok;el('feedback').className=ok?'correct':'wrong';el('feedback').textContent=ok?'Correct!':'Incorrect. Correct answer: '+correct;el('answer').style.borderColor=ok?'#16a34a':'#dc2626';el('status').textContent=`Score: ${results.filter(x=>x===true).length} correct / ${results.filter(x=>x!==null).length} answered • ${cards.length} total cards`}
function move(d){if(!order.length)return;position=(position+d+order.length)%order.length;render()}
el('check').addEventListener('click',checkAnswer);
el('answer').addEventListener('keydown',e=>{if(e.key==='Enter')checkAnswer()});
el('next').addEventListener('click',()=>move(1));el('prev').addEventListener('click',()=>move(-1));
el('shuffle').addEventListener('click',()=>{order=cards.map((_,i)=>i);for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}position=0;render()});
el('missed').addEventListener('click',()=>{const misses=results.map((r,i)=>r===false?i:-1).filter(i=>i>=0);if(misses.length===0){el('feedback').textContent='No missed cards to review yet.';return}order=misses;position=0;render()});
el('all').addEventListener('click',()=>{order=cards.map((_,i)=>i);position=0;render()});
el('edit').addEventListener('click',()=>{el('editArea').style.display='block';el('editText').value=getAnswer(current())});
el('save').addEventListener('click',()=>{const v=el('editText').value.trim();if(v){overrides[current()]=v;try{localStorage.setItem(prefix+'-edits',JSON.stringify(overrides))}catch(e){}el('editArea').style.display='none';el('feedback').textContent='Updated answer saved for this browser.'}});
render();
</script></body></html>
